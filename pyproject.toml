[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search-engine"
version = "0.1.0"
description = "An Indonesian News Search Engine (lexical, BM25, TF-IDF, and Hybrid)"
authors = [
    { name = "Aulia Muzhaffar", email = "auliamuzhaffar@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "Sastrawi>=1.0.1",
    "scikit-learn>=1.3.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.24.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
